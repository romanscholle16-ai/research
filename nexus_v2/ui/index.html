<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS V2 — Research Console</title>
<style>
:root{--bg:#07080c;--bg2:#0d0f16;--panel:#11141d;--panel2:#161a26;--line:#222838;--tx:#d7deef;--dim:#7d88a6;--cy:#22e3ff;--vi:#9a6bff;--mg:#ff3ea5;--gr:#2bd67b;--am:#ffb020;--rd:#ff4d5e;--mono:ui-monospace,Consolas,"Cascadia Mono",monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
body{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--bg2);border-right:1px solid var(--line);padding:14px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 18px 14px;font:700 17px var(--mono);letter-spacing:.14em;color:var(--cy)}.brand small{display:block;color:var(--dim);font-size:10px;letter-spacing:.2em}
nav a{display:block;padding:8px 18px;color:var(--dim);text-decoration:none;border-left:2px solid transparent;font-size:13px}
nav a:hover{color:var(--tx);background:#ffffff08}nav a.on{color:var(--cy);border-left-color:var(--cy);background:linear-gradient(90deg,#22e3ff14,transparent)}
main{padding:0 22px 40px;min-width:0}
header{position:sticky;top:0;z-index:5;background:#07080cee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font:600 18px var(--mono);margin:0;letter-spacing:.06em}h2{font:600 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--vi);margin:0 0 10px}
.pill{font:700 11px var(--mono);padding:3px 9px;border-radius:99px;border:1px solid;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.healthy,.ok,.passed,.verified{color:var(--gr);border-color:var(--gr)}.degraded,.warn,.idle,.paused,.assumed,.in_progress,.part{color:var(--am);border-color:var(--am)}
.dead,.stalled,.fail,.failed,.critical,.error{color:var(--rd);border-color:var(--rd)}.stopped,.offline,.unk,.unverified,.pending{color:var(--dim);border-color:var(--dim)}
.banner{background:#ff4d5e22;border:1px solid var(--rd);color:#ffb3ba;padding:8px 12px;border-radius:6px;margin:10px 0;display:none}
.grid{display:grid;gap:14px;margin-top:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0;box-shadow:0 0 0 1px #00000040,0 0 22px #22e3ff08}
.stat{font:700 26px var(--mono);color:var(--cy)}.lbl{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.sub{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid #1a1f2d;vertical-align:top}tr:hover td{background:#ffffff05}.mono{font-family:var(--mono)}.wrap{overflow-x:auto}
button{background:#1b2133;color:var(--tx);border:1px solid var(--line);padding:6px 12px;border-radius:5px;cursor:pointer;font:600 12px var(--mono);letter-spacing:.05em}
button:hover{border-color:var(--cy);color:var(--cy)}button.danger:hover{border-color:var(--rd);color:var(--rd)}button.go{border-color:var(--gr);color:var(--gr)}
input,select,textarea{background:#0a0c13;color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:12px var(--mono);max-width:100%}
.bar{height:7px;background:#1a1f2d;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy))}
.goal{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #1a1f2d}.sym{font:700 20px var(--mono);text-align:center}
.sym.s_ok{color:var(--gr)}.sym.s_part{color:var(--am)}.sym.s_fail{color:var(--rd)}.sym.s_unk{color:var(--dim)}
.gname{font-weight:600}.gt{color:var(--dim);font-size:12px}.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:12.5px}.kv b{color:var(--dim);font-weight:500}
a{color:var(--cy);cursor:pointer}.tag{font:11px var(--mono);color:var(--mg);border:1px solid var(--mg);padding:1px 6px;border-radius:4px}
pre{background:#0a0c13;border:1px solid var(--line);padding:10px;border-radius:6px;overflow:auto;max-height:480px;font:11.5px var(--mono);white-space:pre-wrap}
svg text{fill:var(--dim);font:10px var(--mono)}.warnbox{border-left:3px solid var(--am);background:#ffb02012;padding:8px 12px;margin:8px 0;font-size:12.5px}
@media(max-width:800px){body{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap}nav a{padding:6px 10px}.brand{width:100%}main{padding:0 16px 30px}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.card:hover{border-color:#2d3650}}
</style></head><body>
<nav id="nav"><div class="brand">NEXUS V2<small>RESEARCH ONLY · NO LIVE TRADING</small></div></nav>
<main><header><h1 id="title">Dashboard</h1><span id="hpill" class="pill unk">…</span><span id="hreason" class="sub"></span>
<span style="flex:1"></span><span id="ctl"></span></header>
<div id="offline" class="banner"></div><div id="view"></div></main>
<script>
const TOKEN="__TOKEN__",NAV=__NAV__;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(x,d=2)=>x==null||isNaN(x)?"—":Number(x).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const int=x=>x==null?"—":Number(x).toLocaleString();
const ago=t=>{if(!t)return"—";const s=Date.now()/1000-t;return s<90?Math.round(s)+"s ago":s<5400?Math.round(s/60)+"m ago":s<172800?Math.round(s/3600)+"h ago":Math.round(s/86400)+"d ago"};
const dt=t=>t?new Date(t*1000).toISOString().replace("T"," ").slice(0,19):"—";
const dtms=t=>t?new Date(t).toISOString().slice(0,10):"—";
let offline=false,lastOK=0;
async function api(p,opt){try{const r=await fetch(p,opt);if(!r.ok)throw new Error(r.status);const j=await r.json();try{localStorage.setItem("nx:"+p,JSON.stringify({t:Date.now(),j}))}catch(e){}offline=false;lastOK=Date.now();return j}
catch(e){offline=true;try{const c=JSON.parse(localStorage.getItem("nx:"+p));if(c){c.j.__cached=c.t;return c.j}}catch(e2){}return null}}
async function post(p,b){const r=await fetch(p,{method:"POST",headers:{"X-Nexus-Token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify(b||{})});return r.json()}
const sym=s=>({"✓":"s_ok","◐":"s_part","✕":"s_fail","?":"s_unk"}[s]);
const pill=(t,c)=>`<span class="pill ${c||t}">${esc(String(t).replace(/_/g," "))}</span>`;
function bar(p){return p==null?"":`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p*100))}%"></i></div>`}
function spark(v,w=300,h=60,col="#22e3ff"){if(!v||v.length<2)return`<div class="sub">not enough data</div>`;const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;const pts=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-4-(y-mn)/r*(h-8)).toFixed(1)}`).join(" ");return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${pts}"/><text x="2" y="10">${fmt(mx,1)}</text><text x="2" y="${h-2}">${fmt(mn,1)}</text></svg>`}
function bars(v,w=300,h=60,col="#9a6bff"){if(!v||!v.length)return`<div class="sub">no data</div>`;const mx=Math.max(...v)||1,bw=w/v.length;return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${v.map((y,i)=>`<rect x="${(i*bw+1).toFixed(1)}" y="${(h-3-y/mx*(h-12)).toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" height="${(y/mx*(h-12)).toFixed(1)}" fill="${col}"/>`).join("")}<text x="2" y="9">max ${int(mx)}</text></svg>`}
function table(cols,rows,fn){return`<div class="wrap"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows.length?rows.map(fn).join(""):`<tr><td colspan="${cols.length}" class="sub">none yet</td></tr>`}</table></div>`}
function goalRows(gs,compact){return gs.map(g=>`<div class="goal"><div class="sym ${sym(g.symbol)}" title="${esc(g.status)}">${esc(g.symbol)}</div><div>
<div class="gname">${g.n}. ${esc(g.name)} <span class="pill ${({"✓":"ok","◐":"part","✕":"fail","?":"unk"})[g.symbol]}">${esc(g.status)}</span></div>
<div class="gt">Target: ${esc(g.target)}</div><div class="mono" style="font-size:12px;margin:3px 0">Actual: ${esc(g.actual)}</div>${bar(g.progress)}
${compact?"":`<div class="kv" style="margin-top:6px"><b>Evidence</b><span>${esc(g.evidence)} · stage: ${esc(g.stage)}</span><b>Explanation</b><span>${esc(g.explanation)}</span><b>Remaining obstacle</b><span>${esc(g.obstacle||"none")}</span><b>Last evaluated</b><span>${dt(g.evaluated_at)}</span></div>`}</div></div>`).join("")}
function sid(id){return`<a href="#/strategy/${esc(id)}" class="mono">${esc(id)}</a>`}

const pages={};
pages["Dashboard"]=async()=>{const o=await api("/api/overview");if(!o)return"<div class=card>No data cached yet and the backend is unreachable.</div>";
const k=o.counters,h=o.health,s=o.system,act=o.activity||{};const w=[["15m",900],["30m",1800],["1h",3600],["3h",10800],["6h",21600],["12h",43200]];
const best=o.best_exploratory,lbC=o.leaderboards.C;
const eq=o.goals_candidate?await api("/api/strategy/"+o.goals_candidate):null;
return`<div class="grid g6">${[["Closed simulated trades",k.closed_trades],["Completed backtests",k.backtests],["Unique canonical strategies",k.unique_strategies],["Completed experiments",k.experiments_completed],["Queue pending",k.queue_pending],["Hypotheses rejected / total",k.hypotheses_rejected+" / "+k.hypotheses]].map(x=>`<div class=card><div class=lbl>${x[0]}</div><div class=stat>${typeof x[1]==="string"?x[1]:int(x[1])}</div></div>`).join("")}</div>
<div class="grid g2"><div class=card><h2>Runtime &amp; campaign</h2><div>${pill(h.status)} <span class=sub>desired: ${esc(h.desired)} · supervisor pid ${esc(h.supervisor_pid)} · heartbeat ${h.supervisor_heartbeat_age_s??"—"}s</span></div>
<div class="kv" style="margin-top:8px"><b>Workers alive</b><span>${h.workers_alive}</span><b>Jobs done 1m / 5m</b><span>${h.jobs_done_last_1m} / ${h.jobs_done_last_5m}</span><b>Queue</b><span>pending ${k.queue_pending} · running ${k.queue_running} · quarantined ${k.quarantined}</span><b>Last checkpoint</b><span>${o.checkpoint?ago(o.checkpoint.ts)+(o.checkpoint.ok?" ✓ verified":" ✕ failed"):"none"}</span><b>Last recovery</b><span>${o.last_recovery?ago(o.last_recovery.ts)+` (${o.last_recovery.requeued} jobs requeued, db ok=${o.last_recovery.db_ok})`:"none"}</span><b>Live trading</b><span class=mono>DISABLED (no order code exists)</span></div>
<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class=go onclick="ctl('start')">Start research</button><button onclick="ctl('pause')">Pause</button><button onclick="ctl('resume')">Resume</button><button class=danger onclick="ctl('stop')">Stop gracefully</button></div></div>
<div class=card><h2>Data freshness &amp; quality</h2>${table(["Symbol","Newest bar","Rows","Gaps","Dupes","Bad","Class"],o.data,d=>`<tr><td>${esc(d.symbol)}</td><td>${dtms(d.e)}</td><td>${int(d.rows)}</td><td>${d.gaps}</td><td>${d.dupes}</td><td>${d.bad_rows}</td><td>${pill(d.data_class,"ok")}</td></tr>`)}
<div class=sub style="margin-top:6px">Source: Binance USDT-M public archive (proxy venue — BTCC prices not used).</div></div></div>
<div class="grid g2"><div class=card><h2>Best exploratory candidate <span class=tag>UNQUALIFIED</span></h2>${best?`${sid(best.strategy_id)} · ${esc(best.family)} ${esc(best.symbol)}/${esc(best.timeframe)}<div class=mono>dev expectancy ${fmt(best.dev_exp_r,3)}R · t=${fmt(best.dev_t)} · ${best.dev_trades} trades · ${esc(best.label)}</div>`:`<div class=sub>None yet.</div>`}
<h2 style="margin-top:14px">Best independently validated candidate</h2>${o.best_validated?sid(o.best_validated.strategy_id):`<div class=sub>None — no candidate has passed every gate.</div>`}</div>
<div class=card><h2>Closest to financial goals</h2>${table(["Strategy","✓","◐","✕","?","Goal symbols"],lbC.slice(0,5),r=>`<tr><td>${sid(r.strategy_id)}<div class=sub>${esc(r.family)}</div></td><td>${r.met}</td><td>${r.partial}</td><td>${r.failed}</td><td>${r.unknown}</td><td class=mono>${esc(r.symbols)}</td></tr>`)}</div></div>
<div class=card style="margin-top:14px"><h2>The 15 financial objectives ${o.goals_candidate?"(closest candidate "+o.goals_candidate+")":"(no candidate yet)"}</h2><div class="grid g2" style="margin:0">${goalRows(o.goals.slice(0,8),true)}<div>${goalRows(o.goals.slice(8),true)}</div></div></div>
<div class="grid g2"><div class=card><h2>Research progress &amp; stagnation indicators</h2>${table(["Window","Experiments","Informative","Promising","Validations","Invalid"],w,x=>{const a=act[x[1]]||{};return`<tr><td>${x[0]}</td><td>${int(a.experiments)}</td><td>${int(a.informative)}</td><td>${int(a.promising)}</td><td>${int(a.validations)}</td><td>${int(a.invalid)}</td></tr>`})}
<div class=sub>Negative results count as informative. Activity ≠ evidence of profitability.</div></div>
<div class=card><h2>Experiments per hour (24h)</h2>${bars(o.throughput.map(t=>t.n))}<h2 style="margin-top:12px">Simulated equity of closest candidate (stored trades, $300 start)</h2>${eq&&eq.equity&&eq.equity.length>1?spark(eq.equity.map(e=>e[1]),300,70):`<div class=sub>No candidate with stored out-of-sample trades yet.</div>`}</div></div>
<div class="grid g2"><div class=card><h2>Agents</h2>${table(["Agent","Experiments","Budget 1h","Promising"],o.agents,a=>`<tr><td>${esc(a.title)}</td><td>${int(a.experiments)}</td><td>${a.budget_used_1h}/${o.settings.agent_budget_per_hour}</td><td>${a.promising}</td></tr>`)}</div>
<div class=card><h2>Guardians</h2>${o.guardians.map(g=>`<div style="margin-bottom:8px">${pill(g.alive?"healthy":"dead")} <b>${esc(g.name)}</b> <span class=sub>hb ${g.heartbeat_age}s · failed checks 1h: ${g.failed_checks_1h}</span></div>`).join("")}
<h2 style="margin-top:12px">System</h2><div class="kv"><b>CPU load</b><span>${s.cpu_pct}%</span><b>RAM</b><span>${s.mem.used_pct}% of ${int(s.mem.total_mb)} MB</span><b>GPU</b><span>${s.gpu.present?esc(s.gpu.name)+" "+s.gpu.vram_total_mb+" MB":"none detected (not required)"}</span><b>Disk free</b><span>${s.disk.free_gb} GB</span><b>Queue</b><span>${k.queue_pending}</span></div></div></div>
<div class="grid g2"><div class=card><h2>Current hypotheses</h2>${table(["Agent","Family","Status","N"],o.hypotheses,x=>`<tr><td>${esc(x.agent)}</td><td>${esc(x.family)} ${esc(x.symbol)}/${esc(x.timeframe)}</td><td>${pill(x.status,"unk")}</td><td>${x.n_experiments}</td></tr>`)}<h2 style="margin-top:12px">Next scheduled experiments</h2>${table(["Agent","Family","Why"],o.next_experiments,x=>`<tr><td>${esc(x.agent)}</td><td>${esc(x.family)}</td><td class=sub>${esc(x.why)}</td></tr>`)}</div>
<div class=card><h2>Recent failures, recoveries &amp; incidents</h2>${table(["When","Component","Sev","Detail","State"],o.incidents,i=>`<tr><td>${ago(i.detected_at)}</td><td>${esc(i.component)}</td><td>${pill(i.severity,i.severity==="critical"||i.severity==="error"?"fail":"warn")}</td><td>${esc(i.error.slice(0,110))}<div class=sub>${esc(i.recovery||"")}</div></td><td>${i.resolved_at?pill("resolved","ok"):pill("open","warn")}</td></tr>`)}</div></div>`};
window.ctl=async(c,args)=>{const r=await post("/api/control",{command:c,args});setTimeout(render,1200)};

pages["Strategies"]=async()=>{const d=await api("/api/strategies");if(!d)return"<div class=card>unavailable</div>";const L=d.leaderboards;
const t=(rows,cols,fn)=>table(cols,rows,fn);
return`<div class=warnbox>Three separate leaderboards so the best-looking historical strategy is never confused with the most trustworthy one. No single score is used.</div>
<div class=card><h2>A · Exploratory <span class=tag>UNQUALIFIED</span></h2>${t(L.A,["Strategy","Family","Mkt","Dev exp R","t","Trades","Status"],r=>`<tr><td>${sid(r.strategy_id)}</td><td>${esc(r.family)}</td><td>${esc(r.symbol)}/${esc(r.timeframe)}</td><td>${fmt(r.dev_exp_r,3)}</td><td>${fmt(r.dev_t)}</td><td>${r.dev_trades}</td><td>${esc(r.status||r.label)}</td></tr>`)}</div>
<div class=card style="margin-top:14px"><h2>B · Validation progress</h2>${t(L.B,["Strategy","Family","Stage","Status","Gates passed","WF exp R","WF t"],r=>`<tr><td>${sid(r.strategy_id)}</td><td>${esc(r.family)}</td><td>${esc(r.stage)}</td><td>${esc(r.status)}</td><td>${r.gates_passed}/4</td><td>${fmt(r.wf_exp,3)}</td><td>${fmt(r.wf_t)}</td></tr>`)}</div>
<div class=card style="margin-top:14px"><h2>C · Closest to the 15 goals</h2>${t(L.C,["Strategy","Family","✓","◐","✕","?","Symbols (goals 1–15)"],r=>`<tr><td>${sid(r.strategy_id)}</td><td>${esc(r.family)}</td><td>${r.met}</td><td>${r.partial}</td><td>${r.failed}</td><td>${r.unknown}</td><td class=mono>${esc(r.symbols)}</td></tr>`)}</div>
<div class=card style="margin-top:14px"><h2>Strategy families (${Object.keys(d.families).length})</h2>${t(Object.entries(d.families),["Family","Agent","Grid size","Title"],([f,v])=>`<tr><td>${esc(f)}</td><td>${esc(v.agent)}</td><td>${int(v.grid)}</td><td>${esc(v.title)}</td></tr>`)}</div>`};
pages["Strategy"]=async(id)=>{const d=await api("/api/strategy/"+id);if(!d)return"<div class=card>Strategy not found or backend unreachable.</div>";
const a=d.assessment,c=d.candidate;
return`<div class=card><h2>${esc(d.family)} · ${esc(d.symbol)}/${esc(d.timeframe)} <span class=mono>${esc(d.id)}</span></h2>
<div>${c?pill(c.status,c.status==="qualified"?"ok":"warn")+" stage: "+esc(c.stage):pill("not a candidate","unk")} ${c&&c.status!=="qualified"?'<span class=tag>NOT QUALIFIED</span>':''}</div>
<div class=sub style="margin:6px 0">${esc(d.family_info.hypothesis)} <i>Falsifier: ${esc(d.family_info.falsifier)}</i></div>
<div class="grid g2"><div><div class=lbl>Full specification</div><pre>${esc(JSON.stringify(d.spec,null,1))}</pre></div>
<div><div class=lbl>Reproducibility</div><div class=kv><b>Engine</b><span>${esc(d.engine_version)}</span><b>Thresholds hash</b><span class=mono>${esc(d.thresholds_hash.slice(0,16))}</span><b>Agent</b><span>${esc(d.agent)}</span><b>Costs assumed</b><span class=mono>fee ${d.assumptions.taker_fee*100}%/side · slip ${d.assumptions.slippage_bps}bps · spread ${d.assumptions.half_spread_bps}bps · MMR ${d.assumptions.mmr*100}% (assumed)</span>
<b>Fees / funding / slippage</b><span class=mono>${fmt(d.costs.fees)} / ${fmt(d.costs.funding)} / ${fmt(d.costs.slippage)} USD (stored trades)</span><b>Net (stored trades)</b><span class=mono>${fmt(d.costs.net)} USD</span><b>Max drawdown (stored)</b><span>${fmt(d.max_dd_stored*100,1)}%</span></div>
${a?`<div class=lbl style="margin-top:8px">Gates</div>${Object.entries(a.gates).map(([k,v])=>`<div>${pill(v,v==="passed"?"ok":v==="failed"?"fail":"warn")} ${esc(k)}</div>`).join("")}<div class=lbl style="margin-top:8px">Blockers</div>${a.blockers.map(b=>`<div class=sub>• ${esc(b)}</div>`).join("")||"none"}`:""}</div></div></div>
<div class=card style="margin-top:14px"><h2>All 15 goals for this strategy</h2>${goalRows(d.goals)}</div>
<div class="grid g2"><div class=card><h2>Simulated equity ($300 start, stored trades)</h2>${d.equity.length>1?spark(d.equity.map(e=>e[1]),400,90):'<div class=sub>No stored trades (only candidates that reached walk-forward store trades).</div>'}</div>
<div class=card><h2>Validation evidence</h2>${table(["Stage","Result","Trades","Detail"],d.validations,v=>`<tr><td>${esc(v.stage)}</td><td>${pill(v.passed===1?"passed":v.passed===0?"failed":"in_progress")}</td><td>${v.n_trades}</td><td class=sub>${esc((v.metrics.failures||[]).join("; ")||v.metrics.progress||"")}</td></tr>`)}</div></div>

const RATIONALE={s1_min_trades:"Quick rejection needs a minimum of events to avoid noise.",s2_min_trades:"Standard error of mean R ≈ sd/√n: below ~80 trades a 1.5σ edge is indistinguishable from luck.",s2_min_t:"One-sided p≈0.07 screen; deliberately permissive because later stages are stricter.",wf_min_trades:"Pooled out-of-sample sample size needed for a usable confidence interval.",wf_ci_level:"Block bootstrap (blocks preserve serial dependence); lower bound must exceed 0.",wf_min_multiple_testing_t:"Bar is max(floor, √(2 ln M)), the expected maximum of M null t-statistics, M = candidates tested.",rb_min_neighbor_positive_frac:"A real edge should survive one-step parameter moves; an isolated peak is likely overfit.",rb_cost_stress_multiplier:"Edge must survive doubled fees+slippage (execution uncertainty).",max_drawdown:"95th percentile of Monte-Carlo drawdown at 1% risk per trade.",max_risk_of_ruin:"Probability equity touches 50% of start within ~6 months of trades.",ho_min_trades:"Holdout is a single look; needs enough trades to be meaningful.",ho_max_evaluations_total:"Every look at the holdout is a selection event, so the total number is capped.",pf_min_days:"Paper-forward needs real elapsed time on data that did not exist at selection."};

pages["Settings"]=async()=>{const d=await api("/api/settings");if(!d)return"<div class=card>unavailable</div>";
return`<div class=card><h2>Safe resource settings</h2><div class=sub>Bounded; the backend rejects out-of-range values. Trusted settings (goals, thresholds, costs, risk limits) are read-only here.</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0">${Object.entries(d.bounds).map(([k,b])=>`<label class=sub>${k} [${b[0]}–${b[1]}]<br><input id="set_${k}" value="${d.settings[k]}"></label>`).join("")}</div><button onclick="saveSet()">Save</button> <span id=setmsg class=sub></span></div>
<div class=card style="margin-top:14px"><h2>Trusted configuration (read-only) <span class=mono>${esc(d.trusted_hash.slice(0,16))}</span></h2><pre>${esc(JSON.stringify(d.trusted,null,1))}</pre></div>`};
window.saveSet=async()=>{const b={};document.querySelectorAll("[id^=set_]").forEach(e=>b[e.id.slice(4)]=+e.value);const r=await post("/api/settings",b);document.getElementById("setmsg").textContent=r.error?r.error:"saved"};

function route(){const h=location.hash.slice(2);if(h.startsWith("strategy/"))return["Strategy",h.slice(9)];const n=NAV.find(x=>x.toLowerCase().replace(/ /g,"-")===h);return[n||"Dashboard"]}
let busy=false;
async function render(){if(busy)return;busy=true;try{const [name,arg]=route();document.getElementById("title").textContent=name==="Strategy"?"Strategy detail":name;
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.n===name));
const hh=await api("/api/health");const hp=document.getElementById("hpill");if(hh){hp.className="pill "+hh.status;hp.textContent=hh.status;document.getElementById("hreason").textContent=hh.reasons.join("; ")||("desired: "+hh.desired);
document.getElementById("ctl").innerHTML=`<span class=sub>workers ${hh.workers_alive} · queue ${hh.queue.pending}</span>`}else{hp.className="pill dead";hp.textContent="unreachable"}
const html=await pages[name](arg);document.getElementById("view").innerHTML=html;
const b=document.getElementById("offline");if(offline){b.style.display="block";b.textContent="Backend unreachable — showing last-known cached results"+(lastOK?"":" (none cached for some panels)")+". The runtime is NOT shown as healthy."}else b.style.display="none"}catch(e){document.getElementById("view").innerHTML=`<div class=card><span class="pill fail">render error</span> ${esc(e.message)}</div>`}finally{busy=false}}
document.getElementById("nav").insertAdjacentHTML("beforeend",NAV.map(n=>`<a data-n="${n}" href="#/${n.toLowerCase().replace(/ /g,"-")}">${n}</a>`).join(""));
addEventListener("hashchange",render);render();setInterval(()=>{if(document.visibilityState==="visible"&&!document.activeElement.matches("input,textarea,select"))render()},5000);
</script></body></html>
